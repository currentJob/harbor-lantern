openapi: 3.1.0

# =============================================================================
# Harbor Lantern — 브라우저 ↔ 서버 API 계약 (SSoT)
#
# 문서: docs/02_설계서.md (DOC-HKG-02 v1.0, 2026-09-13) §7
# 소유: 백엔드(IMP-B) → 사용: 프론트(IMP-C)
#
# 이 파일과 FastAPI 가 생성하는 app.openapi() 의 경로·메서드·상태코드 집합은
# tests/api/test_openapi_contract.py 가 대조한다. 한쪽만 바꾸면 테스트가 실패한다.
#
# 422 가 거의 모든 경로에 적힌 이유: FastAPI 는 경로 파라미터나 본문이 있는 모든
# 오퍼레이션에 422 를 자동으로 문서화한다. 대조를 "정확히 같은 집합"으로 유지하려면
# 계약도 그것을 적어야 한다 — 예외를 두면 그 예외가 드리프트의 문이 된다.
#
# 규약
#  - 모든 시각 필드: *_at = UTC ISO-8601 ('...Z'),  *_local = HKT 'HH:MM' 또는 'YYYY-MM-DD'
#  - 모든 금액 필드: *_minor = 정수 HKD cent (부동소수 금지)
#  - 에러 본문은 Error 스키마 하나로 통일
#  - /api/weather, /api/fx 는 실패해도 200 이다 (NFR-004) — 본문의 available/stale 로 표현
# =============================================================================

info:
  title: Harbor Lantern API
  version: "1.0.0"
  description: |
    홍콩 3박4일 동적 여행 가이드. 무계정(초대코드) 공유 모델.

    **접근 통제 고지**: 초대코드를 아는 사람은 그 여행의 전체 편집 권한을 갖는다(가정 A4).
    권한 등급·소유자 개념은 없다.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://127.0.0.1:8080
    description: 로컬 실행 (`uv run python -m harbor_lantern`)

tags:
  - name: trips
    description: 여행 생성·조회·참여·상태 동기화
  - name: spots
    description: 스팟 CRUD·순서·완료 체크·동선 최적화
  - name: expenses
    description: 경비·정산
  - name: external
    description: 날씨·환율 (캐시 + 폴백)
  - name: meta
    description: 헬스체크·정적 자산

security:
  - participantToken: []

paths:
  /api/explore/destinations:
    get:
      tags:
      - explore
      summary: Destinations
      operationId: destinations_api_explore_destinations_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 100
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '429':
          description: 조회가 진행 중입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 장소 제공자 연결 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/explore/guides:
    get:
      tags:
      - explore
      summary: Guides
      description: |
        구운 도시 가이드 목록 (REQ-027 · 설계서 §16.15).
        "일본"·"Japan"·"JP" 가 같은 결과를 준다. 구운 도시가 없으면 **빈 목록 + 안내 문구를 200 으로**
        돌려준다 — "없음"은 오류가 아니다(AC-076). 외부 호출이 0건이라 429·503 이 없다(NFR-017).
      operationId: guides_api_explore_guides_get
      parameters:
      - name: q
        in: query
        required: false
        description: 국가명(완전 일치) 또는 도시명(접두 일치)
        schema:
          type: string
          minLength: 1
          maxLength: 100
          title: Q
      - name: country
        in: query
        required: false
        description: ISO 3166-1 국가 코드
        schema:
          type: string
          minLength: 2
          maxLength: 3
          pattern: '^[A-Za-z]{2,3}$'
          title: Country
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/explore/guides/{city_id}:
    get:
      tags:
      - explore
      summary: Guide Detail
      description: |
        도시 하나의 구운 가이드 (REQ-022 · REQ-024). 굽지 않은 도시는 404 이고,
        식별자 형식(`^[a-z0-9-]+$`)에 맞지 않으면 422 다 — 경로 조작을 파일 읽기로
        만들지 않기 위해 **검증 뒤에만** 경로에 붙인다(설계서 §16.12).
      operationId: guide_detail_api_explore_guides__city_id__get
      parameters:
      - name: city_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9-]+$'
          title: City Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideCityDetail'
        '404':
          description: 아직 조사되지 않은 도시입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/explore/plan:
    post:
      tags:
      - explore
      summary: Plan
      operationId: plan_api_explore_plan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuidedPlanResponse'
        '429':
          description: 조회가 진행 중입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 장소 제공자 연결 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/explore/nearby:
    get:
      tags:
      - explore
      summary: Nearby
      operationId: nearby_api_explore_nearby_get
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          title: Lat
      - name: lng
        in: query
        required: true
        schema:
          type: number
          maximum: 180
          minimum: -180
          title: Lng
      - name: radius_m
        in: query
        required: false
        schema:
          type: integer
          maximum: 3000
          minimum: 100
          default: 800
          title: Radius M
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '429':
          description: 조회가 진행 중입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 장소 제공자 연결 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------- trips ---
  /api/trips:
    post:
      tags: [trips]
      summary: 여행 생성 (27스팟 시드 자동 주입)
      description: |
        4개 일자(Day 1~4)와 27개 스팟을 시드로 주입하고, 초대코드와 개설자 참가자 토큰을 발급한다.
        일자별 스팟 수는 순서대로 6·9·8·4다. (REQ-001 · REQ-002 · AC-001 · AC-002 · AC-003)
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripCreateRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripCreateResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [trips]
      summary: 여행 메타 조회 (초대코드 포함)
      description: 같은 여행을 다시 조회해도 초대코드는 동일하다. (REQ-002 · AC-003)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/join:
    post:
      tags: [trips]
      summary: 초대코드로 참여 (계정 없음)
      description: |
        (REQ-003 · NFR-006 · AC-004 · AC-005 · AC-040)

        **응답 구분 금지**: 존재하지 않는 코드와 형식이 틀린 코드는 완전히 동일한 404 본문을
        반환한다. 422 는 오직 표시명 문제에만 쓴다.

        레이트 리밋 검사는 코드 유효성 검사보다 **먼저** 수행한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRequest' }
      responses:
        '200':
          description: 참여 완료. 참가자 토큰은 이 응답에서 한 번만 반환된다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinResponse' }
        '404':
          description: 초대코드를 찾을 수 없음 (형식 오류 포함 — 본문 동일)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: invite_not_found, message: "초대코드를 찾을 수 없습니다." }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/trips/{trip_id}/state:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [trips]
      summary: 전체 상태 조회 (타임라인·경고·충돌·진행률 포함)
      description: |
        (REQ-010~REQ-013 · REQ-016 · AC-035 · AC-036)

        응답은 `trip.revision` 만으로 결정되며 **서버의 현재 시각에 의존하지 않는다.**
        그래서 ETag 를 리비전으로 만들 수 있다. 현재 시각이 필요한 표시(현지 시계, "지금 열려 있나")는
        클라이언트가 계산한다.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          example: '"7"'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema: { type: string }
              description: '"<revision>" 형식'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripState' }
        '304':
          description: 변경 없음 (본문 없음)
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ---------------------------------------------------------------- spots ---
  /api/trips/{trip_id}/days/{day_index}/spots:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/DayIndex'
    post:
      tags: [spots]
      summary: 스팟 생성 (해당 일자 목록 끝에 추가)
      description: (REQ-004 · AC-006)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpotCreateRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Spot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}/spots/{spot_id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/SpotId'
    patch:
      tags: [spots]
      summary: 스팟 수정 (낙관적 잠금)
      description: |
        (REQ-004 · NFR-012 · AC-007 · AC-047)

        본문의 `version` 이 저장된 값과 다르면 409 를 반환하고 **아무것도 덮어쓰지 않는다.**
        409 응답의 `detail.current` 에 최신 리소스가 실린다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpotUpdateRequest' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Spot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: version 불일치 — 최신 리소스 동봉
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [spots]
      summary: 스팟 삭제 (남은 순서 0..n-1 재부여)
      description: (REQ-004 · AC-007 · AC-008)
      responses:
        '204': { description: 삭제됨 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}/days/{day_index}/order:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/DayIndex'
    put:
      tags: [spots]
      summary: 일자 내 순서 재배열 (원자)
      description: |
        (REQ-005 · NFR-012 · AC-008 · AC-047)

        `spot_ids` 는 그 일자의 스팟 **전체 집합과 정확히 일치**해야 한다. 누락·중복·외부 ID 가
        하나라도 있으면 422 이고 **아무것도 쓰지 않는다**. 단일 트랜잭션에서 처리하며 부분 반영은 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderRequest' }
      responses:
        '200':
          description: 재배열됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayOrderResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}/spots/{spot_id}/move:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/SpotId'
    post:
      tags: [spots]
      summary: 일자 간 스팟 이동
      description: |
        (REQ-005 · AC-009) 원본·대상 두 일자를 같은 트랜잭션에서 0..n-1 로 재부여한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRequest' }
      responses:
        '200':
          description: 이동됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MoveResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RevisionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}/spots/{spot_id}/done:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/SpotId'
    put:
      tags: [spots]
      summary: 방문 완료 체크 / 해제 (멱등)
      description: (REQ-006 · AC-010 · AC-011)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DoneResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}/days/{day_index}/optimize:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/DayIndex'
    post:
      tags: [spots]
      summary: 동선 최적화 제안 (읽기 전용 — 저장하지 않는다)
      description: |
        (REQ-009 · AC-017 · AC-018)

        고정시각 스팟(앵커)은 현재 인덱스 자리를 유지한다. 제안의 총 이동거리는 현재 순서보다
        **크지 않다** — 개선이 없으면 현재 순서를 그대로 돌려주고 `improved: false` 다.
        적용하려면 `PUT /api/trips/{trip_id}/days/{day_index}/order` 를 호출한다.
      responses:
        '200':
          description: 제안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------- expenses ---
  /api/trips/{trip_id}/expenses:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [expenses]
      summary: 경비 목록 (원화 환산 포함)
      description: |
        (REQ-007 · REQ-015 · AC-029) 환율이 `available:false` 면 `amount_krw` 는 null 이고
        `amount_minor` 는 정상 반환된다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [expenses]
      summary: 경비 기록
      description: |
        (REQ-007 · NFR-014 · AC-012 · AC-013) 분담액은 기록 시점에 결정론적으로 배분해
        저장한다: `base = amount // n`, 나머지 `r` 은 참가자 ID 오름차순 앞에서 `r` 명에게 +1.
        분담액 합계는 항상 원금과 정확히 일치한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCreateRequest' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}/expenses/{expense_id}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - name: expense_id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [expenses]
      summary: 경비 수정 (낙관적 잠금)
      description: (REQ-007 · NFR-012)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseUpdateRequest' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: version 불일치
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionConflictError' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [expenses]
      summary: 경비 삭제
      responses:
        '204': { description: 삭제됨 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/trips/{trip_id}/settlement:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [expenses]
      summary: 최소 송금 정산
      description: |
        (REQ-008 · NFR-014 · AC-014 · AC-015 · AC-016)

        잔액 = 낸 돈 − 부담해야 할 돈. 잔액 합계는 항상 0. 송금 건수는 참가자 수 n 에 대해
        n-1 이하. 정렬 규칙이 고정돼 있어 같은 입력에 항상 같은 결과가 나온다.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------- external ---
  /api/weather:
    get:
      tags: [external]
      summary: 홍콩 날씨 (서버 캐시 TTL 900초 + stale 폴백)
      description: |
        (REQ-014 · NFR-004 · AC-026 · AC-027 · AC-038)

        공급자: Open-Meteo `https://api.open-meteo.com/v1/forecast` (API 키 불필요, 조회일 2026-09-13).
        TTL 근거: 응답 자신이 `current.interval: 900` 을 준다.

        **항상 200 이다.** 외부 실패는 상태코드가 아니라 `available` / `stale` 로 표현한다.
      security: []
      responses:
        '200':
          description: 캐시 적중 · 갱신 성공 · stale 폴백 · 데이터 없음 모두 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherResponse' }

  /api/fx:
    get:
      tags: [external]
      summary: 환율 HKD→KRW (서버 캐시 TTL 21600초 + stale 폴백)
      description: |
        (REQ-015 · NFR-004 · AC-028)

        공급자: Frankfurter `https://api.frankfurter.dev/v1/latest?base=HKD&symbols=KRW`
        (API 키 불필요, 조회일 2026-09-13). TTL 근거: ECB 는 영업일 16:00 CET 에 1회 갱신한다.

        `rate_date` 는 공급자가 준 환율 기준일이며 **조회일과 다를 수 있다**(주말·공휴일).
        이것은 고장이 아니므로 `stale` 로 표시하지 않는다. `stale` 은 오직 "우리 캐시가 만료됐는데
        갱신에 실패했다"를 뜻한다.
      security: []
      responses:
        '200':
          description: 항상 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FxResponse' }

  /api/nearby:
    get:
      tags: [external]
      summary: 현재 위치 기준 근처 음식점·카페 (서버 캐시 TTL 1800초 + stale 폴백)
      description: |
        (REQ-017 · NFR-004 · AC-050~AC-056)

        공급자: OpenStreetMap Overpass `POST https://overpass-api.de/api/interpreter`
        (API 키 불필요, 조회일 2026-09-14).

        **참가자 토큰을 요구하지 않는다** — 여행에 속한 데이터가 아니라 공개 지리
        정보이며 `/api/weather`·`/api/fx` 와 같은 성격이다.

        `distance_m` 과 `directions_url` 은 **캐시에 저장되지 않는다.** 캐시 키는 좌표를
        소수 3자리(≈110m)로 양자화해 공유하므로, 거리를 함께 캐시하면 최대 110m 어긋난
        값이 굳는다. 둘 다 요청이 실제로 보낸 좌표로 응답 조립 시 계산한다.

        카테고리 목록의 SSoT 는 `config.NEARBY_CATEGORIES` 다. 지금 켜져 있는 것은
        `restaurant`·`cafe`·`fast_food` 뿐이며, 꺼진 카테고리를 요청하면 **422** 다
        (조용히 무시하면 "결과 없음"과 구분되지 않는다).
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
          description: 현재 위치 위도
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
          description: 현재 위치 경도
        - name: radius_m
          in: query
          required: false
          schema: { type: integer, minimum: 100, maximum: 3000, default: 800 }
          description: 검색 반경(m)
        - name: category
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [restaurant, cafe, fast_food] }
          description: 생략하면 켜져 있는 전체 카테고리
      responses:
        '200':
          description: 항상 200 (공급자 실패는 available/stale 로 표현한다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyResponse' }
        '422':
          description: 좌표·반경이 범위 밖이거나 지원하지 않는 카테고리
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/curated:
    get:
      tags: [external]
      summary: 미쉐린 홍콩·마카오 큐레이션 목록 (저장소 내 고정 데이터)
      description: |
        (REQ-019 · AC-058~AC-061)

        **외부 호출이 없다.** `seed/curated-places.json` 을 읽는다 — 그때그때 조회하는
        `/api/nearby` 와 성격이 다르다(저쪽은 "지금 내 주변에 무엇이 있는가",
        이쪽은 "어디가 좋은가").

        **좌표가 없는 항목이 정상이다.** 상당수 식당이 호텔 안에 있고 같은 이름의
        다른 가게·공항 지점이 있어 이름만으로 위치를 가를 수 없었다. 확인하지 못한
        곳은 `lat`·`lng` 가 `null` 이며 **목록에서 빼지 않는다** — 빼면 "홍콩에 미쉐린이
        몇 곳뿐"이라고 잘못 읽힌다. `lat`·`lng` 를 주면 좌표가 있는 항목만 거리순으로
        앞에 오고 나머지는 뒤에 남는다.

        응답에 `sources` 와 `known_gaps` 를 **항상 함께 싣는다.** 이 목록은 크라우드
        평점이 아니라 미쉐린 등급이고 빕구르망이 빠져 있다 — 모르고 쓰면 오독한다.
      security: []
      parameters:
        - name: city
          in: query
          required: false
          schema: { type: string, enum: [HK, MO] }
          description: 생략 시 전체
        - name: min_stars
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 3, default: 1 }
        - name: lat
          in: query
          required: false
          schema: { type: number, minimum: -90, maximum: 90 }
          description: lng 와 **함께** 줘야 한다
        - name: lng
          in: query
          required: false
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: 항상 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuratedResponse' }
        '422':
          description: 범위 밖 값이거나 lat·lng 중 하나만 준 경우
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ----------------------------------------------------------------- meta ---
  # 설계서 §7.2 는 `/healthz` 라고 적었지만 구현·프론트(`web/config.js`)·정적 내보내기가
  # `/api/health` 를 쓴다. 경로를 바꾸는 대신 계약을 구현에 맞췄다 — `/api/*` 안에 있으면
  # CORS·`Cache-Control: no-store` 규칙을 한 번에 받는다(개발내역서에 기록).
  /api/health:
    get:
      tags: [meta]
      summary: 헬스체크
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }

  /:
    get:
      tags: [meta]
      summary: 프론트엔드 (정적 서빙 — 외부 CDN 참조 0건)
      security: []
      responses:
        '200':
          description: index.html
          content:
            text/html:
              schema: { type: string }

  /api/trips/{trip_id}/review-plan:
    post:
      summary: 전체 일정 점검 및 리뷰 기반 제안 (읽기 전용)
      description: |
        use_reviews가 true일 때만 최대 40개 장소의 Google Maps 후기를 조회한다.
        현재·제안 일정, 경고·충돌, 구간 길찾기, 리뷰 출처·조회 상태를 반환한다.
        적용은 기존 PUT /days/{day_index}/order에 여기서 받은 expected_revision을 사용한다.
        이동은 추정치이고 실제 경로는 Google Maps 링크에서 확인한다. 응답은 no-store다.
      parameters:
        - name: trip_id
          in: path
          required: true
          schema: {type: string}
        - name: X-Participant-Token
          in: header
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                use_reviews: {type: boolean, default: false}
      responses:
        '200':
          description: 날짜별 비교·제안 순서·리뷰·구간 링크·expected_revision
          content:
            application/json:
              schema:
                type: object
                required: [expected_revision, days, review_summary, reviews_enabled, notice]
                properties:
                  expected_revision: {type: integer}
                  days: {type: array, items: {type: object}}
                  review_summary: {type: object}
                  reviews_enabled: {type: boolean}
                  notice: {type: string}
        '404':
          description: 여행 또는 접근 권한 없음
        '422':
          description: 요청 형식 오류

components:

  securitySchemes:
    participantToken:
      type: apiKey
      in: header
      name: X-Participant-Token
      description: |
        `POST /api/trips` 또는 `POST /api/join` 이 발급한 참가자 토큰. 서버는 sha256 해시만
        저장하므로 원문은 발급 응답에서 한 번만 얻을 수 있다.

        토큰의 여행과 경로의 `trip_id` 가 다르면 **403 이 아니라 404** 를 반환한다
        (존재 여부를 알려 주지 않는다).

  parameters:
    TripId:
      name: trip_id
      in: path
      required: true
      schema: { type: string }
    SpotId:
      name: spot_id
      in: path
      required: true
      schema: { type: string }
    DayIndex:
      name: day_index
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 4 }

  responses:
    NotFound:
      description: 대상 없음 (또는 접근 권한 없음 — 구분하지 않는다)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: 입력 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 충돌 (예: 같은 여행에 동일 표시명)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RevisionConflict:
      description: expected_revision 불일치 — 최신 상태 동봉
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RevisionConflictError' }
    RateLimited:
      description: 시도 횟수 초과
      headers:
        Retry-After:
          schema: { type: integer }
          description: 초 단위
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Destination:
      properties:
        name:
          type: string
          maxLength: 400
          minLength: 1
          title: Name
        lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Lat
        lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Lng
      additionalProperties: false
      type: object
      required:
      - name
      - lat
      - lng
      title: Destination
    PlanRequest:
      description: |
        `city_id` 와 `destination` 중 **둘 중 하나는 필수**다 (설계서 §16.16).
        `city_id` 가 있으면 구운 가이드 경로로, 없으면 기존 폴백(Overpass) 경로로 간다.
        `city_id` 가 굽지 않은 도시인데 `destination` 도 없으면 422 다.
      properties:
        use_reviews:
          type: boolean
          default: false
          description: 명시적으로 켠 경우에만 최대 40개 후보의 평점·평가 수를 계획에 반영한다.
        city_id:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 64
          nullable: true
          description: 구운 도시 식별자. 있으면 가이드 경로.
          title: City Id
        destination:
          $ref: '#/components/schemas/Destination'
        start_date:
          type: string
          format: date
          title: Start Date
        end_date:
          type: string
          format: date
          title: End Date
        pace:
          type: string
          enum:
          - relaxed
          - balanced
          - full
          title: Pace
          default: balanced
        interests:
          type: string
          enum:
          - mixed
          - culture
          - nature
          title: Interests
          default: mixed
        radius_m:
          type: integer
          maximum: 10000.0
          minimum: 500.0
          title: Radius M
          default: 5000
      additionalProperties: false
      type: object
      required: [start_date, end_date]
      title: PlanRequest

    GuideCity:
      type: object
      additionalProperties: true
      required: [city_id, name_ko, center, grade]
      description: |
        구운 도시 목록의 한 항목 (AC-075). **그대로 `PlanRequest` 입력으로 쓸 수 있다** —
        `city_id` 와 `center` 를 담는다.
      properties:
        city_id:      { type: string, pattern: '^[a-z0-9-]+$' }
        name_ko:      { type: string }
        name_local:   { type: string }
        name_en:      { type: string }
        country_code: { type: string }
        country_ko:   { type: string }
        country_en:   { type: string }
        center:
          type: object
          required: [lat, lng]
          properties:
            lat: { type: number }
            lng: { type: number }
        grade:        { type: string, enum: [full, partial] }
        spot_count:   { type: integer }
        retrieved_at: { type: string }

    GuideListResponse:
      type: object
      additionalProperties: false
      required: [cities, counts, sources, known_gaps, retrieved_at, notice]
      description: 구운 도시가 없으면 `cities` 가 빈 배열이고 `notice` 가 그 사실을 말한다 (AC-076).
      properties:
        cities:
          type: array
          items: { $ref: '#/components/schemas/GuideCity' }
        counts:       { type: object, additionalProperties: true }
        sources:
          type: array
          items: { type: object, additionalProperties: true }
        known_gaps:
          type: array
          items: { type: string }
        retrieved_at: { type: string }
        notice:       { type: string, description: 사용자용 한국어 안내 }

    GuideCityDetail:
      allOf:
        - $ref: '#/components/schemas/GuideCity'
        - type: object
          required: [spots, sources, known_gaps, harvest, notice]
          properties:
            radius_m:   { type: integer }
            harvest:    { type: object, additionalProperties: true, description: 수확 지표 (AC-083 재계산 가능) }
            sources:
              type: array
              items: { type: object, additionalProperties: true }
            known_gaps:
              type: array
              items: { type: string }
            spots:
              type: array
              description: 구운 파일의 스팟 그대로 — 설명·출처·검증 표시를 포함한다 (AC-070).
              items: { type: object, additionalProperties: true }
            notice:     { type: string }

    GuidedPlanResponse:
      type: object
      additionalProperties: true
      required: [days, guide_grade, guide_notice]
      description: |
        `POST /api/explore/plan` 의 200. **기존 응답 필드를 전부 유지한다** — 그래서
        `additionalProperties: true` 다(필드는 더하기만 한다 · AC-078).
      properties:
        guide_grade:
          type: string
          enum: [full, partial, heuristic]
          description: 비어 있을 수 없다 (AC-085). 구운 도시면 그 등급, 아니면 `heuristic`.
        guide_notice:
          type: string
          description: 등급마다 다른 한국어 문구. `heuristic` 은 "제한된 자동 추천"이라고 밝힌다 (AC-077).
        guide_city:
          type: object
          nullable: true
          additionalProperties: true
          description: 폴백 경로면 `null`.
        days:
          type: array
          items: { type: object, additionalProperties: true }

    # ------------------------------------------------------------- 공통 ---
    Error:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:   { type: string, description: 기계용 코드 (snake_case) }
        message: { type: string, description: 사용자용 한국어 설명 }
        detail:  { type: object, additionalProperties: true }

    VersionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            detail:
              type: object
              required: [current]
              properties:
                current:
                  description: 서버가 보유한 최신 리소스
                  type: object
                  additionalProperties: true

    RevisionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            detail:
              type: object
              required: [current_revision]
              properties:
                current_revision: { type: integer }

    # ------------------------------------------------------------- trip ---
    TripCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          default: "홍콩 3박 4일"
        start_date:
          type: string
          format: date
          default: "2026-10-05"
          description: 미지정 시 2026-10-05 (가정 A2). Day 1~4 가 이 날짜부터 연속 배정된다.
        organizer_display_name:
          type: string
          minLength: 1
          maxLength: 24
          default: "개설자"

    TripCreateResponse:
      type: object
      additionalProperties: false
      required: [trip, participant, participant_token]
      properties:
        trip:        { $ref: '#/components/schemas/Trip' }
        participant: { $ref: '#/components/schemas/Participant' }
        participant_token:
          type: string
          description: 이 응답에서 한 번만 반환된다. 서버는 해시만 저장한다.

    Trip:
      type: object
      additionalProperties: false
      required: [id, name, start_date, base_currency, invite_code, invite_code_display, revision, created_at]
      properties:
        id:                  { type: string }
        name:                { type: string }
        start_date:          { type: string, format: date }
        base_currency:       { type: string, const: HKD }
        invite_code:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{12}$'
          description: 정규형 12자 (Crockford Base32, I·L·O·U 제외 — 60.0비트)
        invite_code_display:
          type: string
          description: 사람이 읽는 표기 'XXXX-XXXX-XXXX'
        revision:            { type: integer, minimum: 1 }
        created_at:          { type: string, format: date-time }

    Participant:
      type: object
      additionalProperties: false
      required: [id, display_name, is_organizer, joined_at]
      properties:
        id:           { type: string }
        display_name: { type: string }
        is_organizer: { type: boolean }
        joined_at:    { type: string, format: date-time }

    JoinRequest:
      type: object
      additionalProperties: false
      required: [invite_code, display_name]
      properties:
        invite_code:
          type: string
          description: 대소문자·하이픈·공백 무관. 서버가 정규화한다 (I·L→1, O→0).
        display_name:
          type: string
          minLength: 1
          maxLength: 24

    JoinResponse:
      type: object
      additionalProperties: false
      required: [trip_id, participant, participant_token]
      properties:
        trip_id:           { type: string }
        participant:       { $ref: '#/components/schemas/Participant' }
        participant_token: { type: string }

    # ------------------------------------------------------------- spot ---
    SpotCreateRequest:
      type: object
      additionalProperties: false
      required: [name, lat, lng]
      properties:
        time_label:     { type: string, maxLength: 16, default: "오전" }
        name:           { type: string, minLength: 1, maxLength: 120 }
        name_original:  { type: string, maxLength: 120, default: "" }
        tip:            { type: string, maxLength: 500, default: "" }
        hours_text:     { type: string, maxLength: 200, default: "" }
        closed_text:    { type: string, maxLength: 200, default: "" }
        description:    { type: string, maxLength: 1000, default: "" }
        recommendation: { type: string, maxLength: 500, default: "" }
        lat:            { type: number, minimum: -90,  maximum: 90 }
        lng:            { type: number, minimum: -180, maximum: 180 }
        dwell_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 1440
          description: null 이면 time_label 기반 기본값 (설계서 §6.8 표)

    SpotUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      description: version 외 모든 필드는 선택. 준 필드만 갱신한다.
      properties:
        version:        { type: integer, minimum: 1 }
        time_label:     { type: string, maxLength: 16 }
        name:           { type: string, minLength: 1, maxLength: 120 }
        name_original:  { type: string, maxLength: 120 }
        tip:            { type: string, maxLength: 500 }
        hours_text:     { type: string, maxLength: 200 }
        closed_text:    { type: string, maxLength: 200 }
        description:    { type: string, maxLength: 1000 }
        recommendation: { type: string, maxLength: 500 }
        lat:            { type: number, minimum: -90,  maximum: 90 }
        lng:            { type: number, minimum: -180, maximum: 180 }
        dwell_minutes:  { type: [integer, "null"], minimum: 0, maximum: 1440 }

    Spot:
      type: object
      additionalProperties: false
      required:
        [id, day_index, position, time_label, fixed_start_local, name, name_original,
         tip, hours_text, closed_text, description, recommendation, lat, lng,
         dwell_minutes, dwell_source, version, done, hours, closed_weekdays,
         directions_url, updated_at]
      properties:
        id:                { type: string }
        day_index:         { type: integer, minimum: 1, maximum: 4 }
        position:          { type: integer, minimum: 0 }
        time_label:        { type: string }
        fixed_start_local:
          type: [string, "null"]
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: time_label 이 'HH:MM' 형태면 그 값. 고정시각 일정의 앵커.
        name:              { type: string }
        name_original:     { type: string }
        tip:               { type: string }
        hours_text:        { type: string, description: 자유 문자열 원문 (근사치 — 가정 A1) }
        closed_text:       { type: string }
        description:       { type: string }
        recommendation:    { type: string }
        lat:               { type: number }
        lng:               { type: number }
        dwell_minutes:     { type: integer, minimum: 0 }
        dwell_source:      { type: string, enum: [explicit, time_band] }
        version:           { type: integer, minimum: 1 }
        done:              { $ref: '#/components/schemas/DoneState' }
        hours:             { $ref: '#/components/schemas/HoursSpec' }
        closed_weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0=월 … 6=일. 요일 토큰을 못 찾으면 빈 배열.
        directions_url:
          type: string
          description: 'https://www.google.com/maps/dir/?api=1&destination=<lat>,<lng>'
        updated_at:        { type: string, format: date-time }

    DoneState:
      type: object
      additionalProperties: false
      required: [is_done, by_participant_id, by_display_name, at]
      properties:
        is_done:            { type: boolean }
        by_participant_id:  { type: [string, "null"] }
        by_display_name:    { type: [string, "null"] }
        at:                 { type: [string, "null"], format: date-time }

    HoursSpec:
      type: object
      additionalProperties: false
      required: [status, approximate, open_local, close_local, crosses_midnight, pattern]
      description: |
        파싱 실패는 status=unknown 이고, unknown 은 **경고를 만들지 않는다**(AC-024).
        거짓 경고 하나가 진짜 경고 전부를 무시하게 만든다.
      properties:
        status:
          type: string
          enum: [open_range, open_24h, weekday_range, unknown]
        approximate:
          type: boolean
          description: 원문에 '대략'·'약'·'대체로'·'경' 이 있으면 true
        open_local:       { type: [string, "null"], description: "'HH:MM' (weekday_range 면 null)" }
        close_local:      { type: [string, "null"] }
        crosses_midnight: { type: boolean }
        pattern:
          type: string
          description: 적용된 규칙 ID (P-01 … P-07). 설계서 §6.9 표.
        weekday_open:
          type: [object, "null"]
          additionalProperties:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string }
          description: 'status=weekday_range 일 때 요일(0~6) → ["HH:MM","HH:MM"]'

    ReorderRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, spot_ids]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        spot_ids:
          type: array
          minItems: 0
          items: { type: string }
          description: 그 일자의 스팟 전체 집합과 정확히 일치해야 한다 (누락·중복·외부 ID → 422)

    DayOrderResponse:
      type: object
      additionalProperties: false
      required: [day_index, spot_ids, revision]
      properties:
        day_index: { type: integer }
        spot_ids:  { type: array, items: { type: string } }
        revision:  { type: integer }

    MoveRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, to_day_index]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        to_day_index:      { type: integer, minimum: 1, maximum: 4 }
        to_position:
          type: [integer, "null"]
          minimum: 0
          description: null 이면 대상 일자의 끝

    MoveResponse:
      type: object
      additionalProperties: false
      required: [spot_id, from_day_index, to_day_index, revision]
      properties:
        spot_id:        { type: string }
        from_day_index: { type: integer }
        to_day_index:   { type: integer }
        revision:       { type: integer }

    DoneResponse:
      type: object
      additionalProperties: false
      required: [spot_id, done, progress, revision]
      properties:
        spot_id:  { type: string }
        done:     { $ref: '#/components/schemas/DoneState' }
        progress: { $ref: '#/components/schemas/Progress' }
        revision: { type: integer }

    Progress:
      type: object
      additionalProperties: false
      required: [done, total, percent]
      description: 'percent = round_half_up(done / total * 100). total 이 0 이면 0 (예외 없음 — AC-030)'
      properties:
        done:    { type: integer, minimum: 0 }
        total:   { type: integer, minimum: 0 }
        percent: { type: integer, minimum: 0, maximum: 100 }

    RouteProposal:
      type: object
      additionalProperties: false
      required:
        [day_index, current_order, proposed_order, current_total_distance_m,
         proposed_total_distance_m, improved, algorithm, anchored_spot_ids]
      properties:
        day_index:                 { type: integer }
        current_order:             { type: array, items: { type: string } }
        proposed_order:
          type: array
          items: { type: string }
          description: 입력 집합과 동일 (누락·중복 없음). 개선이 없으면 current_order 와 같다.
        current_total_distance_m:  { type: number, minimum: 0 }
        proposed_total_distance_m:
          type: number
          minimum: 0
          description: 항상 current_total_distance_m 이하 (AC-017)
        improved:                  { type: boolean }
        algorithm:                 { type: string, enum: [exact, two_opt] }
        anchored_spot_ids:
          type: array
          items: { type: string }
          description: 고정시각 스팟 — 인덱스 자리가 유지된다 (AC-018)

    # ------------------------------------------------------------ state ---
    TripState:
      type: object
      additionalProperties: false
      required: [trip, participants, progress, days, warnings, conflicts, expenses_summary]
      properties:
        trip:         { $ref: '#/components/schemas/Trip' }
        participants: { type: array, items: { $ref: '#/components/schemas/Participant' } }
        progress:     { $ref: '#/components/schemas/Progress' }
        days:         { type: array, items: { $ref: '#/components/schemas/DayState' } }
        warnings:     { type: array, items: { $ref: '#/components/schemas/Warning' } }
        conflicts:    { type: array, items: { $ref: '#/components/schemas/Conflict' } }
        expenses_summary:
          type: object
          additionalProperties: false
          required: [count, total_minor, currency]
          properties:
            count:       { type: integer, minimum: 0 }
            total_minor: { type: integer, minimum: 0 }
            currency:    { type: string, const: HKD }

    DayState:
      type: object
      additionalProperties: false
      required: [day_index, date, weekday, title, area, color, start_local, spots, totals]
      properties:
        day_index:   { type: integer, minimum: 1, maximum: 4 }
        date:        { type: string, format: date, description: HKT 달력일 }
        weekday:     { type: integer, minimum: 0, maximum: 6, description: 0=월 … 6=일 }
        title:       { type: string }
        area:        { type: string }
        color:       { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        start_local: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        spots:       { type: array, items: { $ref: '#/components/schemas/SpotInDay' } }
        totals:
          type: object
          additionalProperties: false
          required: [distance_m, travel_minutes, dwell_minutes]
          properties:
            distance_m:     { type: number, minimum: 0, description: 구간 거리의 합 (AC-019) }
            travel_minutes: { type: integer, minimum: 0 }
            dwell_minutes:  { type: integer, minimum: 0 }

    SpotInDay:
      allOf:
        - $ref: '#/components/schemas/Spot'
        - type: object
          required: [schedule, leg_to_next]
          properties:
            schedule:    { $ref: '#/components/schemas/Schedule' }
            leg_to_next:
              oneOf:
                - $ref: '#/components/schemas/Leg'
                - type: "null"
              description: 마지막 스팟이면 null

    Schedule:
      type: object
      additionalProperties: false
      required: [eta_local, depart_local, eta_day_offset, depart_day_offset]
      description: 'eta = 일자 시작시각 + Σ(앞 스팟 체류 + 구간 이동) (AC-021)'
      properties:
        eta_local:         { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        depart_local:      { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        eta_day_offset:    { type: integer, minimum: 0, description: 자정을 넘긴 일수 }
        depart_day_offset: { type: integer, minimum: 0 }

    Leg:
      type: object
      additionalProperties: false
      required: [to_spot_id, distance_m, mode, travel_seconds, overhead_seconds, minutes, estimated]
      description: |
        거리·우회계수·모드별 평균속도의 결정론 함수(AC-020). 실제 경로탐색이 아니다(가정 A8).

        **비례성은 travel_seconds 에 대해서만 성립한다** — overhead_seconds 는 덧셈 항이다.
      properties:
        to_spot_id:       { type: string }
        distance_m:       { type: number, minimum: 0, description: 하버사인 직선거리 }
        mode:             { type: string, enum: [walk, transit] }
        travel_seconds:   { type: integer, minimum: 0, description: 우회계수가 곱해지는 주행 성분 }
        overhead_seconds: { type: integer, minimum: 0, description: 환승·대기 고정 여유 (도보는 0) }
        minutes:          { type: integer, minimum: 0 }
        estimated:        { type: boolean, const: true }

    Warning:
      type: object
      additionalProperties: false
      required: [spot_id, kind, message]
      description: 'hours.status = unknown 인 스팟에 대해서는 경고를 생성하지 않는다 (AC-024)'
      properties:
        spot_id: { type: string }
        kind:    { type: string, enum: [closed_on_arrival, closed_day] }
        message: { type: string }
        eta_local:   { type: [string, "null"] }
        open_local:  { type: [string, "null"] }
        close_local: { type: [string, "null"] }

    Conflict:
      type: object
      additionalProperties: false
      required:
        [spot_id, fixed_spot_id, overlap_start_local, overlap_end_local, overlap_minutes]
      description: |
        고정시각 스팟 F 앞의 스팟 P 의 출발 예정시각이 F 의 시작시각을 **초과**할 때 1건 (AC-025).
        비교는 반드시 `>` 다 — `>=` 면 딱 맞는 일정이 충돌로 잡힌다.
      properties:
        spot_id:             { type: string, description: 침범하는 앞 스팟 P }
        fixed_spot_id:       { type: string, description: 침범당한 고정시각 스팟 F }
        overlap_start_local: { type: string }
        overlap_end_local:   { type: string }
        overlap_minutes:     { type: integer, minimum: 1 }

    # ---------------------------------------------------------- expenses ---
    ExpenseCreateRequest:
      type: object
      additionalProperties: false
      required: [payer_id, amount_minor, share_participant_ids]
      properties:
        payer_id:     { type: string }
        amount_minor:
          type: integer
          minimum: 1
          description: HKD cent. 0 이하면 422 (AC-012)
        currency:     { type: string, const: HKD, default: HKD }
        note:         { type: string, maxLength: 200, default: "" }
        spot_id:      { type: [string, "null"], default: null }
        spent_at:     { type: [string, "null"], format: date-time, default: null }
        share_participant_ids:
          type: array
          minItems: 1
          items: { type: string }
          description: 비어 있으면 422 (AC-012)

    ExpenseUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:      { type: integer, minimum: 1 }
        payer_id:     { type: string }
        amount_minor: { type: integer, minimum: 1 }
        note:         { type: string, maxLength: 200 }
        spot_id:      { type: [string, "null"] }
        share_participant_ids:
          type: array
          minItems: 1
          items: { type: string }

    Expense:
      type: object
      additionalProperties: false
      required:
        [id, payer_id, amount_minor, amount_krw, currency, note, spot_id,
         spent_at, shares, version]
      properties:
        id:           { type: string }
        payer_id:     { type: string }
        amount_minor: { type: integer, minimum: 1 }
        amount_krw:
          type: [integer, "null"]
          description: |
            (amount_minor × rate_micro + 50_000_000) // 100_000_000 — 정수 half-up (AC-029).
            환율이 available=false 면 null.
        currency:     { type: string, const: HKD }
        note:         { type: string }
        spot_id:      { type: [string, "null"] }
        spent_at:     { type: string, format: date-time }
        version:      { type: integer, minimum: 1 }
        shares:
          type: array
          description: 기록 시점에 확정 저장된 분담액. 합계는 amount_minor 와 정확히 일치한다.
          items:
            type: object
            additionalProperties: false
            required: [participant_id, share_minor]
            properties:
              participant_id: { type: string }
              share_minor:    { type: integer, minimum: 0 }

    ExpenseList:
      type: object
      additionalProperties: false
      required: [items, total_minor, total_krw, currency, fx]
      properties:
        items:       { type: array, items: { $ref: '#/components/schemas/Expense' } }
        total_minor: { type: integer, minimum: 0 }
        total_krw:   { type: [integer, "null"] }
        currency:    { type: string, const: HKD }
        fx:          { $ref: '#/components/schemas/FxResponse' }

    Settlement:
      type: object
      additionalProperties: false
      required: [currency, balances, transfers]
      properties:
        currency: { type: string, const: HKD }
        balances:
          type: array
          description: 'balance_minor 합계는 항상 0 (NFR-014)'
          items:
            type: object
            additionalProperties: false
            required: [participant_id, display_name, paid_minor, owed_minor, balance_minor]
            properties:
              participant_id: { type: string }
              display_name:   { type: string }
              paid_minor:     { type: integer, minimum: 0 }
              owed_minor:     { type: integer, minimum: 0 }
              balance_minor:  { type: integer, description: paid − owed }
        transfers:
          type: array
          description: '건수는 참가자 수 n 에 대해 n-1 이하 (AC-015). 잔액이 전부 0 이면 빈 배열'
          items:
            type: object
            additionalProperties: false
            required: [from_participant_id, to_participant_id, amount_minor]
            properties:
              from_participant_id: { type: string }
              to_participant_id:   { type: string }
              amount_minor:        { type: integer, minimum: 1 }

    # ---------------------------------------------------------- external ---
    ExternalMeta:
      type: object
      required: [available, stale, fetched_at]
      properties:
        available:
          type: boolean
          description: false 면 캐시도 없고 갱신도 실패했다. 위젯만 비활성화하고 앱은 계속 동작한다.
        stale:
          type: boolean
          description: true 면 캐시 만료 후 갱신에 실패해 마지막 성공값을 돌려준 것이다 (AC-027)
        fetched_at:
          type: [string, "null"]
          format: date-time
          description: 마지막 '성공' 시각 (UTC)

    WeatherResponse:
      allOf:
        - $ref: '#/components/schemas/ExternalMeta'
        - type: object
          properties:
            temp_c:            { type: [number, "null"] }
            humidity_pct:      { type: [integer, "null"] }
            precipitation_mm:  { type: [number, "null"] }
            weather_code:      { type: [integer, "null"], description: WMO 코드 }
            today_max_c:       { type: [number, "null"] }
            today_min_c:       { type: [number, "null"] }
            precip_prob_pct:   { type: [integer, "null"] }
            observed_local:    { type: [string, "null"], description: "'YYYY-MM-DDTHH:MM' (HKT)" }
            source:            { type: string, const: open-meteo }

    FxResponse:
      allOf:
        - $ref: '#/components/schemas/ExternalMeta'
        - type: object
          properties:
            base:  { type: string, const: HKD }
            quote: { type: string, const: KRW }
            rate_micro:
              type: [integer, "null"]
              description: 환율 × 1_000_000 (정수. 부동소수 금지 — NFR-014)
            rate_date:
              type: [string, "null"]
              format: date
              description: |
                공급자가 준 환율 기준일. 조회일과 다를 수 있다(ECB 는 영업일에만 갱신).
                이것은 고장이 아니므로 stale 로 표시하지 않는다.
            source: { type: string, const: frankfurter }

    CuratedPlace:
      type: object
      required: [name, city, city_label, stars, tier_label]
      properties:
        name:        { type: string }
        city:        { type: string, enum: [HK, MO] }
        city_label:  { type: string }
        stars:       { type: integer, minimum: 1, maximum: 3 }
        tier_label:  { type: string }
        lat:
          type: [number, "null"]
          description: 확인하지 못한 곳은 null 이다 — 추정 좌표를 넣지 않는다
        lng:         { type: [number, "null"] }
        distance_m:
          type: [number, "null"]
          description: lat·lng 를 준 요청에서, 좌표가 있는 항목에만 채워진다
        address:     { type: [string, "null"] }
        district:    { type: [string, "null"] }
        coord_confidence:
          type: [string, "null"]
          description: 좌표를 어떻게 알아냈는지 — 근거 없는 좌표는 검증할 수 없다

    CuratedResponse:
      type: object
      required: [dataset, retrieved_at, what_this_is, sources, known_gaps, counts, returned, places]
      properties:
        dataset:       { type: string }
        retrieved_at:  { type: string, description: 조사 시점 }
        what_this_is:  { type: string }
        sources:
          type: array
          items: { type: object }
          description: 출처 없는 추천 목록은 그냥 누군가의 취향이다
        known_gaps:
          type: array
          items: { type: string }
          description: 빠진 것·확인 못 한 것. 항상 데이터와 함께 다닌다
        counts:   { type: object }
        returned: { type: integer }
        places:
          type: array
          items: { $ref: '#/components/schemas/CuratedPlace' }

    NearbyPlace:
      type: object
      required: [osm_type, osm_id, name, lat, lng, category, category_label,
                 distance_m, directions_url]
      properties:
        osm_type:       { type: string, description: 'node · way · relation' }
        osm_id:         { type: integer }
        name:           { type: string, description: 이름 없는 항목은 애초에 실리지 않는다 (AC-056) }
        lat:            { type: number }
        lng:            { type: number }
        category:       { type: string, enum: [restaurant, cafe, fast_food] }
        category_label: { type: string, description: '화면에 그대로 쓰는 한국어 라벨 (음식점·카페·간편식)' }
        distance_m:
          type: number
          description: 요청이 보낸 좌표로부터의 직선거리. 캐시에 저장되지 않는다
        directions_url:
