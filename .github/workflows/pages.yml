# 화면(정적 자산)만 GitHub Pages 로 배포한다.
#
# 백엔드(FastAPI + SQLite)는 사용자의 PC 에서 돌고, 브라우저가 그쪽으로 직접 요청한다.
# 그래서 여기서 올리는 것은 `src/harbor_lantern/web` 그대로이고, 서버 주소는 굽지 않는다 —
# 터널 주소는 재시작마다 바뀌므로 배포 시점에 박아 넣으면 그때마다 다시 배포해야 한다.
# 대신 화면이 런타임에 주소를 받는다(`?api=` 쿼리 또는 게이트의 "백엔드 주소" 칸, 기기에 저장).
#
# 저장소 변수 `HL_API_BASE` 를 설정해 두면 기본값으로 구워진다(선택).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 실행은 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 정적 자산 수집
        shell: bash
        env:
          HL_API_BASE: ${{ vars.HL_API_BASE }}
        run: |
          set -euo pipefail
          cp -r src/harbor_lantern/web _site
          # Jekyll 이 밑줄로 시작하는 경로를 삼키지 않게 한다.
          touch _site/.nojekyll
          # 서버 주소는 비워 두는 것이 기본이다. 비어 있으면 화면이 먼저 물어본다.
          base="${HL_API_BASE:-}"
          if [ -n "$base" ]; then
            case "$base" in
              https://*) ;;
              *) echo "HL_API_BASE 는 https 여야 한다: $base" >&2; exit 1 ;;
            esac
          fi
          printf 'window.HARBOR_CONFIG = Object.freeze({ apiBase: "%s" });\n' "$base" > _site/config.js
          echo "배포 대상 $(find _site -type f | wc -l) 파일 · apiBase='${base:-(런타임 입력)}'"

      - name: 외부 도메인 참조 재확인
        # AC-042 는 저장소에서 검사하지만, **배포되는 물건**에서 한 번 더 본다.
        # 배포 산출물이 검사 대상과 다르면 검사는 자기 자신을 검사한 것이다.
        #
        # 범위는 저장소 검사(tests/static/test_frontend_assets.py)와 같게 둔다 —
        # 우리 소스(index.html · css · js)만 보고 `vendor/` 는 제외한다. 벤더 파일은
        # MANIFEST.sha256 이 따로 지키며, 라이브러리 배너 주석의 홈페이지 URL은
        # 요청을 유발하지 않는다. 두 검사의 범위가 어긋나면 한쪽이 거짓말을 하게 된다.
        shell: bash
        run: |
          set -euo pipefail
          hits=$(grep -rInE 'https?://[a-zA-Z0-9.-]+' _site \
                   --include='*.html' --include='*.css' --include='*.js' \
                   --exclude-dir=vendor \
                 | grep -v 'basemaps.cartocdn.com' \
                 | grep -v 'www.google.com' || true)
          if [ -n "$hits" ]; then
            echo "배포 산출물에 예상 밖 외부 도메인이 있다:" >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "외부 도메인 참조: 지도 타일·길찾기 링크 외 없음 (vendor 는 MANIFEST.sha256 이 검증)"

      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4.0.5
